<!doctype html><html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;font-family:Poppins,sans-serif}
.l{width:1200px;height:630px;background:#2E1350;position:relative;overflow:hidden;padding:70px 80px;color:#D8CEE8;box-sizing:border-box}
.b{position:absolute;border-radius:58% 42% 47% 53%/48% 55% 45% 52%}
.a{width:520px;height:520px;right:-140px;top:-190px;background:#F6A416}.c{width:240px;height:240px;right:300px;bottom:-150px;background:#E51D3F}
img.logo{height:78px;position:relative;margin-bottom:46px}
span{position:relative;display:block;font-size:22px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#F6A416;margin-bottom:14px}
h1{position:relative;color:#fff;font-size:66px;font-weight:800;letter-spacing:-.035em;line-height:1.04;margin:0;max-width:720px}
.libro{position:absolute;right:90px;bottom:70px;width:300px;height:220px;display:flex;filter:drop-shadow(0 20px 30px rgba(0,0,0,.4))}
.libro div{flex:1;background:#fff;border-radius:6px 2px 2px 6px}.libro div+div{border-radius:2px 6px 6px 2px;background:#F4F1F8}
</style></head><body><div class="l"><i class="b a"></i><i class="b c"></i>
<img class="logo" src="../assets/img/logo-gonfle-blanco.png" alt=""><span>Catálogo de productos</span><h1>Hojea nuestro catálogo y cotiza por WhatsApp</h1>
</div></body></html>
